name: Java compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    name: Canonical Java 17 artifact
    runs-on: ubuntu-26.04
    container: maven:3.10.0-eclipse-temurin-17@sha256:b67db904974d04b9e6eba5b073ae227569ee1cae0d1f26be8993525291ef76dc
    timeout-minutes: 20
    outputs:
      jar-name: ${{ steps.artifact.outputs.jar-name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Record toolchain
        run: mvn --version
      - name: Build and verify canonical artifact
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Resolve canonical artifact name
        id: artifact
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.build.finalName \
            -Doutput="$RUNNER_TEMP/artifact-final-name.txt"
          printf 'jar-name=%s.jar\n' "$(cat "$RUNNER_TEMP/artifact-final-name.txt")" >> "$GITHUB_OUTPUT"
      - name: Upload canonical artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-java17
          path: target/${{ steps.artifact.outputs.jar-name }}
          if-no-files-found: error
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-diagnostics
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  compatibility:
    name: Build and runtime Java ${{ matrix.java }}
    needs: canonical
    runs-on: ubuntu-26.04
    container: maven:3.10.0-eclipse-temurin-17@sha256:b67db904974d04b9e6eba5b073ae227569ee1cae0d1f26be8993525291ef76dc
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25', '27']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-java17
          # Keep this outside target, which the fresh build removes.
          path: canonical-artifact
      - name: Record toolchain
        run: mvn --version
      - name: Fresh build and canonical artifact runtime verification
        shell: bash
        env:
          CANONICAL_JAR: ${{ needs.canonical.outputs.jar-name }}
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify
          "-Dcompatibility.jar=$GITHUB_WORKSPACE/canonical-artifact/$CANONICAL_JAR"
      - name: Validate handwritten Javadoc at the endpoints
        if: matrix.java == '17' || matrix.java == '27'
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress dependency:build-classpath -Dmdep.outputFile=target/javadoc-classpath.txt
          find src/main/java src/test/java src/test/resources/compatibility -name '*.java' -print > target/javadoc-sources.txt
          javadoc -quiet -private -Xdoclint:all,-missing -Werror -encoding UTF-8 \
            -classpath "target/classes:target/test-classes:$(cat target/javadoc-classpath.txt)" \
            -d target/compatibility-javadoc @target/javadoc-sources.txt
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-${{ matrix.java }}-diagnostics
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  required:
    name: Java compatibility
    if: always()
    needs: [canonical, compatibility]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every build and runtime check
        env:
          CANONICAL_RESULT: ${{ needs.canonical.result }}
          MATRIX_RESULT: ${{ needs.compatibility.result }}
        run: test "$CANONICAL_RESULT" = success && test "$MATRIX_RESULT" = success
